<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Strength, core, foot and plyometric sessions for a 12-week half marathon plan (v03)">
<title>Strength Sessions</title>
<style>
:root{
  color-scheme: dark light;
  --bg:#0f1216;
  --bg2:#141a21;
  --card:#171d25;
  --card2:#1d242e;
  --fg:#e9eef4;
  --muted:#98a6b5;
  --line:#28313d;
  --accent:#4cc2ff;
  --accent-ink:#04202e;
  --good:#7bd88f;
  --warn:#ffb15c;
  --bad:#ff7a7a;
  --info:#b79cff;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --radius:16px;
  --maxw:820px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f6f9; --bg2:#ffffff; --card:#ffffff; --card2:#f1f4f8;
    --fg:#16202b; --muted:#5d6c7c; --line:#dde4ec;
    --accent:#0a6fb0; --accent-ink:#ffffff;
    --good:#1f7a45; --warn:#a8600d; --bad:#b4352f; --info:#6a4bc4;
    --shadow:0 8px 24px rgba(20,40,60,.10);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,select,a{font-family:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
a{color:var(--accent)}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative}

/* ---------- HEADER ---------- */
header.top{
  position:fixed; top:0; left:0; right:0; z-index:30;
  transform:translate3d(0,0,0); will-change:transform;
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));
}
header.top.settling{transition:transform .2s cubic-bezier(.2,.7,.3,1)}
header.top.raised{box-shadow:0 8px 20px rgba(0,0,0,.30)}
@media (prefers-color-scheme: light){ header.top.raised{box-shadow:0 8px 18px rgba(20,40,60,.13)} }
.top-inner{max-width:var(--maxw);margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.brand h1{font-size:1.02rem;margin:0;letter-spacing:.2px}
.brand .sub{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}

.tabs{
  display:flex;gap:6px;background:var(--card2);border:1px solid var(--line);
  padding:4px;border-radius:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 1 auto;white-space:nowrap;padding:8px 11px;border-radius:11px;
  font-size:.84rem;font-weight:600;color:var(--muted);text-align:center;
  transition:background .16s,color .16s;
}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.tab .tab-sub{display:block;font-size:.66rem;font-weight:500;opacity:.8}

.jump-row{display:flex;gap:8px;align-items:center;margin-top:10px}
.jump-row label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;flex:0 0 auto}
select#jump{
  flex:1 1 auto;min-width:0;appearance:none;-webkit-appearance:none;
  background:var(--card2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2398a6b5' stroke-width='3'><path d='M5 9l7 7 7-7'/></svg>") no-repeat right 12px center;
  border:1px solid var(--line);color:var(--fg);border-radius:11px;
  padding:10px 34px 10px 12px;font-size:.9rem;font-weight:500;
}
.session-note{
  margin:10px 0 0;padding:9px 12px;border-radius:11px;font-size:.82rem;
  background:color-mix(in srgb,var(--warn) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);
  color:var(--fg);
}
.session-note.hide{display:none}

/* ---------- MAIN ---------- */
main{
  flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding:calc(var(--head-h,168px) + 12px) calc(14px + env(safe-area-inset-right)) 26px calc(14px + env(safe-area-inset-left));
  scroll-padding-top:calc(var(--head-h,168px) + 12px);
}
.card{
  max-width:var(--maxw);margin:0 auto;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.card-head{padding:16px 16px 14px;border-bottom:1px solid var(--line);background:var(--card2)}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.11em;color:var(--accent);font-weight:700}
.card-head h2{margin:6px 0 12px;font-size:clamp(1.25rem,4.6vw,1.6rem);line-height:1.2;letter-spacing:-.2px}
.card-head h2 .alias{color:var(--muted);font-weight:600;font-size:.72em;display:block;margin-top:4px}
.card-head .lede{margin:-4px 0 0;color:var(--muted);font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:64px}
.chip .k{display:block;font-size:.63rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.chip .v{display:block;font-size:.95rem;font-weight:700}
.chip.hero{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chip.flag{border-color:color-mix(in srgb,var(--info) 45%,transparent);background:color-mix(in srgb,var(--info) 12%,transparent)}
.chip.flag .v{font-size:.82rem}

.card-body{padding:4px 16px 18px}
section.blk{padding:14px 0;border-bottom:1px solid var(--line)}
section.blk:last-child{border-bottom:0;padding-bottom:4px}
h3.blk-t{
  margin:0 0 8px;font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);font-weight:700;display:flex;align-items:center;gap:7px;
}
h3.blk-t::before{content:"";width:3px;height:13px;background:var(--accent);border-radius:2px;flex:0 0 auto}
h3.blk-t.warn::before{background:var(--bad)}
h3.blk-t.good::before{background:var(--good)}
h3.blk-t.info::before{background:var(--info)}
h3.blk-t.amber::before{background:var(--warn)}
.blk p{margin:0 0 8px}
.blk p:last-child{margin-bottom:0}

ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 12px 38px}
ol.steps li:last-child{padding-bottom:0}
ol.steps li::before{
  content:counter(s);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:50%;
  background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;
}
.sub-t{margin:14px 0 8px;font-size:.9rem;font-weight:700}
.sub-t:first-child{margin-top:0}

ul.dots{margin:0;padding-left:20px}
ul.dots li{margin-bottom:7px}
ul.dots li:last-child{margin-bottom:0}
ul.dots.bad li::marker{color:var(--bad)}
ul.dots.good li::marker{color:var(--good)}

.callout{
  background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:0 11px 11px 0;padding:11px 13px;margin:0 0 10px;
}
.callout:last-child{margin-bottom:0}
.callout.rule{border-left-color:var(--warn)}
.callout.feel{border-left-color:var(--good)}
.callout.evidence{border-left-color:var(--info)}
.callout h4{margin:0 0 4px;font-size:.85rem;font-weight:800}
.callout p{margin:0;font-size:.94rem}
.callout p + p{margin-top:6px}
strong{font-weight:700}

.fb{display:grid;gap:8px}
.fb-row{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.fb-row .if{font-size:.8rem;font-weight:800;color:var(--warn);margin-bottom:3px}
.fb-row .then{font-size:.93rem}

table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
table.tbl th,table.tbl td{text-align:left;vertical-align:top;padding:8px 8px;border-bottom:1px solid var(--line)}
table.tbl tr:last-child th,table.tbl tr:last-child td{border-bottom:0}
table.tbl th{font-weight:700;width:38%;color:var(--fg)}
table.tbl thead th{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.tbl-wrap{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card2)}
.tag{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-right:6px;vertical-align:1px}
.tag.hi{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.tag.mid{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.tag.lo{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}

ul.refs{margin:0;padding-left:18px;font-size:.88rem}
ul.refs li{margin-bottom:8px}
ul.refs .note{display:block;color:var(--muted);font-size:.82rem}

/* ---------- TIMER ---------- */
.timer{margin:14px 0 0;border:1px solid var(--line);border-radius:14px;background:var(--card2);overflow:hidden}
.timer.timed{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.t-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;width:100%}
.t-head .lbl{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em}
.badge{
  font-size:.62rem;letter-spacing:.06em;padding:3px 7px;border-radius:999px;
  background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);
}
.t-head .caret{color:var(--muted);font-size:.78rem;font-weight:700}
.t-body{padding:0 13px 14px;display:block}
.timer.collapsed .t-body{display:none}
.t-phase{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:700;min-height:1.2em}
.t-display{
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
  font-size:clamp(2.6rem,13vw,3.6rem);font-weight:800;line-height:1.05;letter-spacing:-1.5px;margin:2px 0 2px;
}
.t-display.rest{color:var(--warn)}
.t-display.done{color:var(--good)}
.t-round{font-size:.8rem;color:var(--muted);min-height:1.2em}
.t-bar{height:6px;background:var(--card);border-radius:99px;overflow:hidden;margin:9px 0 12px;border:1px solid var(--line)}
.t-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.t-bar i.rest{background:var(--warn)}
.t-presets{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.preset{font-size:.78rem;font-weight:600;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.preset[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.t-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.t-controls button{padding:12px 8px;border-radius:11px;font-weight:800;font-size:.9rem;border:1px solid var(--line);background:var(--card);min-height:46px}
.t-controls button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.t-controls button:disabled{opacity:.42;cursor:default}

/* ---------- FOOTER ---------- */
footer.bottom{
  flex:0 0 auto;
  background:color-mix(in srgb,var(--bg2) 92%,transparent);
  backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);
  border-top:1px solid var(--line);
  padding:9px calc(12px + env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
}
.bottom-inner{max-width:var(--maxw);margin:0 auto;display:flex;flex-direction:column;gap:8px}
.video-row{display:flex;gap:8px}
.video-row.hide{display:none}
.btn-video{
  flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg);
  background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:.88rem;font-weight:700;min-height:46px;
}
.btn-video:active{background:var(--card)}
.btn-video .play{color:var(--bad);font-size:1.05rem;line-height:1}
.btn-alt{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);
  background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:.78rem;font-weight:700;min-height:46px;
}
.nav-row{display:flex;align-items:center;gap:8px}
.nav-btn{
  flex:1 1 0;min-height:52px;border-radius:13px;font-size:.95rem;font-weight:800;
  background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;
}
.nav-btn.next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nav-btn:disabled{opacity:.35;cursor:default}
.counter{flex:0 0 auto;text-align:center;min-width:96px}
.counter .n{font-size:.86rem;font-weight:800;font-variant-numeric:tabular-nums}
.counter .pbar{height:4px;border-radius:99px;background:var(--card2);border:1px solid var(--line);overflow:hidden;margin-top:5px}
.counter .pbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s ease}

@media (min-width:700px){
  .bottom-inner{flex-direction:row-reverse;align-items:center;gap:12px}
  .video-row{flex:0 0 auto;max-width:320px}
  .nav-row{flex:1 1 auto}
}
@media (max-height:760px){
  .bottom-inner{gap:6px}
  .btn-video,.btn-alt{min-height:42px;padding:9px 11px;font-size:.84rem}
  .nav-btn{min-height:46px}
  header.top{padding-bottom:8px}
  .brand{margin-bottom:8px}
  .jump-row{margin-top:8px}
}
.kbd-hint{display:none;font-size:.68rem;color:var(--muted);text-align:center;margin-top:2px}
@media (hover:hover) and (pointer:fine){.kbd-hint{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1>Strength Sessions</h1>
        <span class="sub">Half marathon plan v03</span>
      </div>
      <div class="tabs" id="tabs" role="tablist" aria-label="Training session"></div>
      <div class="jump-row">
        <label for="jump">Jump to</label>
        <select id="jump" aria-label="Jump to card"></select>
      </div>
      <p class="session-note hide" id="sessionNote"></p>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <article class="card" id="card"></article>
  </main>

  <footer class="bottom">
    <div class="bottom-inner">
      <div class="video-row" id="videoRow">
        <a class="btn-video" id="videoBtn" href="#" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">
          <span class="play">&#9654;</span><span>Watch Video Demo</span>
        </a>
        <a class="btn-alt" id="googleBtn" href="#" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" title="Search Google instead">Google</a>
      </div>
      <div class="nav-row">
        <button class="nav-btn" id="prevBtn" type="button">&#8249;&nbsp; Prev</button>
        <div class="counter">
          <div class="n" id="counter">1 of 5</div>
          <div class="pbar"><i id="pfill"></i></div>
        </div>
        <button class="nav-btn next" id="nextBtn" type="button">Next &nbsp;&#8250;</button>
      </div>
      <div class="kbd-hint">&#8592; / &#8594; to move &middot; Space to start or pause the timer</div>
    </div>
  </footer>
</div>

<script>
"use strict";

/* =========================================================
   HELPERS FOR TIMER PRESETS
   ========================================================= */

function buildIntervals(rounds, work, rest, wLabel, rLabel){
  const out = [];
  for (let i=1;i<=rounds;i++){
    out.push({label:`${wLabel} ${i} of ${rounds}`, s:work});
    if (i<rounds) out.push({label:`${rLabel}`, s:rest, rest:true});
  }
  return out;
}
function buildSides(rounds, hold, swap, rest){
  const out = [];
  for (let i=1;i<=rounds;i++){
    out.push({label:`Set ${i}: side 1`, s:hold});
    out.push({label:"Switch sides", s:swap, rest:true});
    out.push({label:`Set ${i}: side 2`, s:hold});
    if (i<rounds) out.push({label:"Rest", s:rest, rest:true});
  }
  return out;
}

/* =========================================================
   EXERCISE AND INFO CARDS (stored once, sessions reference by id)
   ========================================================= */

const KNEE_HIP_FLAG = {k:"Evidence", v:"Knee & hip"};

const EX = {

/* ======================= TUESDAY: STRENGTH A ======================= */

"standing-calf": {
  name: "Standing Calf Raise, Straight Knee",
  video: "standing calf raise straight knee slow eccentric",
  chips: [ {k:"Sets",v:"4",hero:true}, {k:"Reps",v:"8–10",hero:true}, {k:"Tempo",v:"3 s lower"} ],
  dose: [
    ["Weeks 1–4","3 x 10, bodyweight"],
    ["Weeks 5–8","4 x 8–10, loaded"],
    ["Weeks 9–11","4 x 8, heavier"]
  ],
  setup: "Stand on the edge of a step with the balls of your feet on the edge and your heels hanging off. Hold a wall or railing for balance. Start with bodyweight until the movement feels natural.",
  stepGroups: [{ title:"The movement", steps:[
    "Start with your heels dropped below the step. You should feel a gentle stretch in your calves.",
    "Push up onto your toes as high as you can. Pause for one second at the top.",
    "Lower slowly, counting \"one-thousand, two-thousand, three-thousand\" on the way down. This slow lowering is the point of the exercise. Don't rush it.",
    "Let your heels drop just below the step. That's one rep."
  ]}],
  feel: "The big calf muscle (gastrocnemius) doing most of the work, with the soleus underneath still contributing. Both calves should be burning evenly by rep 7 or 8, with a stretch at the bottom and a hard squeeze at the top.",
  cues: [
    {t:"Keep your knees straight", b:"Not locked rigid, but straight. Bending the knees shifts load away from the gastrocnemius and onto the soleus (that's the next exercise)."},
    {t:"Dose check: why it has to be heavy", b:"In a meta-analysis of tendon training studies, high loads (above about 70% of maximum) drove tendon adaptation while lower loads did almost nothing, and programmes of 12 weeks or more worked best (Bohm 2015). 4 x 8 to 10 with a slow lower is an appropriate strength dose (ACSM 2009), but only if the load is heavy. Once two-legged bodyweight raises are easy, go single-leg and add weight.", kind:"evidence"}
  ],
  load: [
    "Pick a load where the last rep of each set leaves about 1 to 3 reps in reserve, with a clean 3-second lower.",
    "Progression: two legs, bodyweight → one leg, bodyweight (roughly doubles the load per leg) → one leg holding a dumbbell on the working side.",
    "Add load when every set reaches 10 reps with 2 or more reps still in reserve."
  ],
  mistakes: [{ items:[
    "Bouncing at the bottom instead of pausing. This uses elastic recoil and bypasses the muscle.",
    "Rushing the lowering phase. If you aren't counting three seconds, you're going too fast.",
    "Leaning forward. Stay upright with your weight directly over the balls of your feet.",
    "Going too heavy too soon. You want 8 reps with good form and a 3-second lower. If you can't, drop the weight."
  ]}],
  timer: null
},

"seated-calf": {
  name: "Seated Calf Raise, Bent Knee",
  video: "seated calf raise bent knee soleus",
  chips: [ {k:"Sets",v:"3",hero:true}, {k:"Reps",v:"12–15",hero:true}, {k:"Tempo",v:"2 s lower"} ],
  dose: [
    ["Weeks 1–4","3 x 12"],
    ["Weeks 5–8","3 x 12–15, loaded"],
    ["Weeks 9–11","3 x 12, loaded"]
  ],
  setup: "Sit on a chair or bench with your knees bent at about 90 degrees. Put the balls of your feet on a thick book or low platform so your heels can drop below it. Place a weight across your knees (a dumbbell on a folded towel works).",
  stepGroups: [{ title:"The movement", steps:[
    "Press through the balls of your feet and lift your heels as high as you can.",
    "Pause briefly at the top.",
    "Lower slowly (2 seconds) until the heels drop below the platform."
  ]}],
  feel: "A burn deeper and lower in the calf than the standing version. This is the soleus, which sits under the gastrocnemius and closer to the Achilles. It should be fatiguing by rep 12.",
  cues: [ {t:"Why it matters", b:"In a musculoskeletal modelling study across running speeds, the soleus and gastrocnemius were the main contributors to vertical support up to about 7 m/s, which covers every distance-running pace (Dorn 2012). Bending the knee slackens the gastrocnemius, so the soleus takes a larger share of the load.", kind:"evidence"} ],
  load: [
    "The soleus is strong, so a single dumbbell on the knees is often too light to make 12 to 15 reps hard.",
    "Options: do one leg at a time with the weight on that knee, stack a loaded backpack on the knees, or use a seated calf or Smith machine if you have access.",
    "Same rule as the standing raise: finish each set with 1 to 3 reps in reserve. 3 x 12 to 15 is an appropriate dose only if rep 12 to 15 is genuinely hard."
  ],

/* =========================================================
   TIMER
   Wall-clock anchored (Date.now) so it survives screen locks and
   background tabs; overshoot carries into the next phase so a
   multi-phase protocol never drifts.
   ========================================================= */

const T = {
  phases: [], idx: 0, remaining: 0, endAt: 0, running: false, done: false,
  stopwatch: false, elapsed: 0, base: 0, startedAt: 0,
  tick: 0, presetIdx: 0, wakeLock: null
};

const timerEl = document.createElement("section");
timerEl.className = "timer";
timerEl.innerHTML = `
  <button class="t-head" id="tHead" type="button" aria-expanded="true" aria-controls="tBody">
    <span class="lbl">Timer <span class="badge" id="tBadge" hidden>timed</span></span>
    <span class="caret" id="tCaret">Hide</span>
  </button>
  <div class="t-body" id="tBody">
    <div class="t-phase" id="tPhase" aria-live="polite"></div>
    <div class="t-display" id="tDisplay" role="timer" aria-live="off">00:00</div>
    <div class="t-round" id="tRound"></div>
    <div class="t-bar"><i id="tFill"></i></div>
    <div class="t-presets" id="tPresets"></div>
    <div class="t-controls">
      <button id="tStart" class="primary" type="button">Start</button>
      <button id="tPause" type="button" disabled>Pause</button>
      <button id="tReset" type="button">Reset</button>
    </div>
  </div>`;

const q = sel => timerEl.querySelector(sel);
const tHead=q("#tHead"), tBadge=q("#tBadge"), tCaret=q("#tCaret"), tPhase=q("#tPhase"),
      tDisplay=q("#tDisplay"), tRound=q("#tRound"), tFill=q("#tFill"), tPresets=q("#tPresets"),
      tStart=q("#tStart"), tPause=q("#tPause"), tReset=q("#tReset");

function restPresets(defaultRest){
  const list = [
    {label:"60 s rest", phases:[{label:"Rest",s:60,rest:true}]},
    {label:"90 s rest", phases:[{label:"Rest",s:90,rest:true}]},
    {label:"2 min rest", phases:[{label:"Rest",s:120,rest:true}]},
    {label:"Stopwatch", stopwatch:true}
  ];
  const want = defaultRest === 120 ? 2 : defaultRest === 90 ? 1 : 0;
  list[want].default = true;
  return list;
}
let activePresets = restPresets(60);

/* --- audio cues, generated in-browser --- */
let AC = null;
function ensureAudio(){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
  }catch(e){}
}
function beep(times, freq, dur){
  try{
    ensureAudio();
    if(!AC) return;
    for(let i=0;i<times;i++){
      const t0 = AC.currentTime + i*(dur+0.09);
      const o = AC.createOscillator(), g = AC.createGain();
      o.type="sine"; o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.35,t0+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+0.02);
    }
  }catch(e){}
}
async function lockScreen(on){
  try{
    if(on && "wakeLock" in navigator && !T.wakeLock && document.visibilityState === "visible"){
      T.wakeLock = await navigator.wakeLock.request("screen");
      T.wakeLock.addEventListener("release", ()=>{ T.wakeLock = null; });
    } else if(!on && T.wakeLock){ const w = T.wakeLock; T.wakeLock = null; await w.release(); }
  }catch(e){}
}

function fmt(ms){
  const total = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(total/60), s = total%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function setPhaseText(s){ if(tPhase.textContent !== s) tPhase.textContent = s; }

function stopLoop(){ if(T.tick){ clearInterval(T.tick); T.tick = 0; } }

function setButtons(state){
  if(state === "running"){ tStart.disabled = true;  tPause.disabled = false; tStart.textContent = "Running"; }
  else if(state === "paused"){ tStart.disabled = false; tPause.disabled = true; tStart.textContent = "Resume"; }
  else { tStart.disabled = false; tPause.disabled = true; tStart.textContent = "Start"; }
}

function loadPreset(i){
  stopLoop();
  T.presetIdx = i;
  const p = activePresets[i];
  T.running = false; T.done = false;
  T.stopwatch = !!p.stopwatch;
  T.phases = p.stopwatch ? [] : p.phases.map(x=>Object.assign({},x));
  T.idx = 0; T.elapsed = 0; T.base = 0;
  T.remaining = T.stopwatch ? 0 : T.phases[0].s*1000;
  [...tPresets.children].forEach((b,bi)=>b.setAttribute("aria-pressed", bi===i ? "true":"false"));
  setButtons("idle");
  lockScreen(false);
  paint();
}

function paint(){
  if(T.stopwatch){
    tDisplay.classList.remove("rest","done");
    setPhaseText("Stopwatch");
    tDisplay.textContent = fmt(T.elapsed);
    tRound.textContent = T.running ? "Counting up" : "";
    tFill.style.width = "0%"; tFill.classList.remove("rest");
    return;
  }
  const phase = T.phases[T.idx];
  const isRest = !!phase.rest && !T.done;
  tDisplay.classList.toggle("rest", isRest);
  tDisplay.classList.toggle("done", T.done);
  setPhaseText(T.done ? "Complete" : phase.label);
  tDisplay.textContent = T.done ? "00:00" : fmt(T.remaining);
  const total = T.phases.length;
  tRound.textContent = total > 1 ? `Segment ${T.idx+1} of ${total}` : "";
  const pct = T.done ? 100 : (1 - (T.remaining/(phase.s*1000))) * 100;
  tFill.style.width = Math.max(0,Math.min(100,pct)) + "%";
  tFill.classList.toggle("rest", isRest);
}

function finish(){
  stopLoop();
  T.remaining = 0; T.running = false; T.done = true;
  beep(3, 880, 0.16);
  setButtons("idle");
  lockScreen(false);
  paint();
}

function tick(){
  if(!T.running) return;
  const now = Date.now();
  if(T.stopwatch){ T.elapsed = T.base + (now - T.startedAt); paint(); return; }
  let advanced = false;
  while(now >= T.endAt){
    if(T.idx >= T.phases.length - 1){ finish(); return; }
    T.idx++;
    T.endAt += T.phases[T.idx].s*1000;   // carry overshoot forward
    advanced = true;
  }
  if(advanced){
    const nxt = T.phases[T.idx];
    beep(nxt.rest ? 1 : 2, nxt.rest ? 520 : 760, 0.14);
  }
  T.remaining = T.endAt - now;
  paint();
}

function startTimer(){
  if(T.running) return;
  if(T.done) loadPreset(T.presetIdx);
  ensureAudio();
  beep(1, 660, 0.1);
  T.running = true;
  const now = Date.now();
  if(T.stopwatch){ T.startedAt = now; }
  else { T.endAt = now + (T.remaining > 0 ? T.remaining : T.phases[T.idx].s*1000); }
  setButtons("running");
  lockScreen(true);
  stopLoop();
  T.tick = setInterval(tick, 200);
  tick();
}
function pauseTimer(){
  if(!T.running) return;
  T.running = false; stopLoop();
  if(T.stopwatch){ T.base += Date.now() - T.startedAt; T.elapsed = T.base; }
  else { T.remaining = Math.max(0, T.endAt - Date.now()); }
  setButtons("paused");
  lockScreen(false);
  paint();
}
function resetTimer(){ loadPreset(T.presetIdx); }
function haltTimer(){ stopLoop(); T.running = false; lockScreen(false); }

tStart.addEventListener("click", startTimer);
tPause.addEventListener("click", pauseTimer);
tReset.addEventListener("click", resetTimer);
tHead.addEventListener("click", ()=>{
  const collapsed = timerEl.classList.toggle("collapsed");
  tHead.setAttribute("aria-expanded", String(!collapsed));
  tCaret.textContent = collapsed ? "Show" : "Hide";
});
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible" && T.running){ tick(); lockScreen(true); }
});

function configureTimer(ex){
  haltTimer();
  const timed = !!ex.timer;
  activePresets = timed ? ex.timer.presets.concat([{label:"Stopwatch", stopwatch:true}]) : restPresets(session().rest);
  tBadge.hidden = !timed;
  timerEl.classList.toggle("timed", timed);
  timerEl.classList.toggle("collapsed", !timed);
  tHead.setAttribute("aria-expanded", String(timed));
  tCaret.textContent = timed ? "Hide" : "Show";
  tPresets.innerHTML = "";
  activePresets.forEach((p,i)=>{
    const b = document.createElement("button");
    b.type="button"; b.className="preset"; b.textContent = p.label;
    b.setAttribute("aria-pressed","false");
    b.addEventListener("click", ()=>loadPreset(i));
    tPresets.appendChild(b);
  });
  const def = Math.max(0, activePresets.findIndex(p=>p.default));
  loadPreset(def);
}

/* =========================================================
   RENDER
   ========================================================= */

function buildTabs(){
  const tabs = $("tabs");
  tabs.innerHTML = "";
  SESSIONS.forEach((s,i)=>{
    const b = document.createElement("button");
    b.type="button"; b.className="tab"; b.id = "tab-"+s.id;
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", String(i===sIdx));
    b.innerHTML = `${esc(s.tab)}<span class="tab-sub">${esc(s.tabSub)}</span>`;
    b.addEventListener("click", ()=>{ if(i!==sIdx){ sIdx=i; eIdx=0; render(); } });
    tabs.appendChild(b);
  });
}

function buildJump(){
  const sel = $("jump");
  sel.innerHTML = "";
  session().items.forEach((id,i)=>{
    const o = document.createElement("option");
    o.value = String(i);
    o.textContent = `${i+1}. ${EX[id].name}`;
    sel.appendChild(o);
  });
  sel.value = String(eIdx);
}

function chipsHTML(chips){
  return (chips||[]).map(c=>{
    const cls = c === KNEE_HIP_FLAG ? " flag" : (c.hero ? " hero" : "");
    return `<div class="chip${cls}"><span class="k">${esc(c.k)}</span><span class="v">${esc(c.v)}</span></div>`;
  }).join("");
}
function stepsHTML(groups){
  return groups.map(g=>`
    ${groups.length>1 ? `<div class="sub-t">${esc(g.title)}</div>` : ""}
    <ol class="steps">${g.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`).join("");
}
function tableHTML(t, allowTags){
  const cell = s => allowTags ? s : esc(s);   // only trusted, hard-coded tag markup is passed unescaped
  return `<div class="tbl-wrap"><table class="tbl">
    ${t.head ? `<thead><tr>${t.head.map(h=>`<th scope="col">${esc(h)}</th>`).join("")}</tr></thead>` : ""}
    <tbody>${t.rows.map(r=>`<tr><th scope="row">${cell(r[0])}</th><td>${esc(r[1])}</td></tr>`).join("")}</tbody>
  </table></div>`;
}

function renderExercise(ex, s){
  const cues = (ex.cues||[]).map(c=>`
    <div class="callout ${c.kind||""}"><h4>${esc(c.t)}</h4><p>${esc(c.b)}</p></div>`).join("");
  const mistakes = ex.mistakes.map(m=>`
    ${m.t ? `<div class="sub-t">${esc(m.t)}</div>` : ""}
    <ul class="dots bad">${m.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`).join("");
  const feedback = ex.feedback ? ex.feedback.map(f=>`
    <div class="fb-row"><div class="if">${esc(f.i)}</div><div class="then">${esc(f.t)}</div></div>`).join("") : "";

  return `
    <div class="card-head">
      <div class="eyebrow">${esc(s.title)} &middot; ${eIdx+1} of ${s.items.length}</div>
      <h2>${esc(ex.name)}${ex.alias ? `<span class="alias">${esc(ex.alias)}</span>` : ""}</h2>
      <div class="chips">${chipsHTML(ex.chips)}</div>
    </div>
    <div class="card-body">
      <section class="blk"><h3 class="blk-t">Setup</h3><p>${esc(ex.setup)}</p></section>
      <section class="blk"><h3 class="blk-t">Step by step</h3>${stepsHTML(ex.stepGroups)}</section>
      <section class="blk"><h3 class="blk-t good">What to feel</h3><div class="callout feel"><p>${esc(ex.feel)}</p></div></section>
      ${cues ? `<section class="blk"><h3 class="blk-t">Tips and evidence</h3>${cues}</section>` : ""}
      ${feedback ? `<section class="blk"><h3 class="blk-t amber">Adjust by feel</h3><div class="fb">${feedback}</div></section>` : ""}
      ${ex.load ? `<section class="blk"><h3 class="blk-t">How to add load</h3><ul class="dots">${ex.load.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>` : ""}
      ${ex.dose ? `<section class="blk"><h3 class="blk-t">Dose across the block</h3>${tableHTML({head:["Phase","Dose"], rows:ex.dose})}</section>` : ""}
      ${ex.altSteps ? `<section class="blk"><h3 class="blk-t">Alternative</h3>
          <div class="sub-t">${esc(ex.altTitle)}</div>
          <ol class="steps">${ex.altSteps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></section>` : ""}
      <section class="blk"><h3 class="blk-t warn">Common mistakes</h3>${mistakes}</section>
      ${ex.evidence ? `<section class="blk"><h3 class="blk-t info">Knee and hip evidence</h3><div class="callout evidence"><p>${esc(ex.evidence)}</p></div></section>` : ""}
      <div id="timerSlot"></div>
    </div>`;
}

function renderInfo(ex, s){
  const secs = ex.sections.map(sec=>{
    let inner = "";
    if(sec.p) inner += sec.p.map(x=>`<p>${esc(x)}</p>`).join("");
    if(sec.list) inner += `<ul class="dots">${sec.list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
    if(sec.table) inner += (sec.p ? `<div style="height:10px"></div>` : "") + tableHTML(sec.table, ex === EX["knee-hip"]);
    if(sec.refs) inner += `<ul class="refs">${sec.refs.map(r=>`
      <li>${r.u ? `<a href="${esc(r.u)}" target="_blank" rel="noopener noreferrer">${esc(r.l)}</a>` : esc(r.l)}${r.n ? `<span class="note">${esc(r.n)}</span>` : ""}</li>`).join("")}</ul>`;
    return `<section class="blk"><h3 class="blk-t ${sec.kind||""}">${esc(sec.t)}</h3>${inner}</section>`;
  }).join("");
  return `
    <div class="card-head">
      <div class="eyebrow">${esc(s.title)} &middot; ${eIdx+1} of ${s.items.length}</div>
      <h2>${esc(ex.name)}</h2>
      ${ex.lede ? `<p class="lede">${esc(ex.lede)}</p>` : ""}
      ${ex.chips ? `<div class="chips" style="margin-top:12px">${chipsHTML(ex.chips)}</div>` : ""}
    </div>
    <div class="card-body">${secs}</div>`;
}

function renderCard(){
  const ex = current(), s = session();
  if(isInfo(ex)){
    haltTimer();
    if(timerEl.parentNode) timerEl.parentNode.removeChild(timerEl);
    $("card").innerHTML = renderInfo(ex, s);
    return;
  }
  $("card").innerHTML = renderExercise(ex, s);
  $("timerSlot").appendChild(timerEl);
  configureTimer(ex);
}

function renderChrome(){
  const s = session();
  [...$("tabs").children].forEach((b,i)=>b.setAttribute("aria-selected", String(i===sIdx)));
  const note = $("sessionNote");
  if(s.note){ note.textContent = s.note; note.classList.remove("hide"); }
  else { note.classList.add("hide"); }

  const n = s.items.length;
  $("counter").textContent = `${eIdx+1} of ${n}`;
  $("pfill").style.width = ((eIdx+1)/n*100) + "%";
  $("prevBtn").disabled = eIdx === 0;
  $("nextBtn").disabled = eIdx === n-1;

  const ex = current();
  $("videoRow").classList.toggle("hide", isInfo(ex));
  if(!isInfo(ex)){
    const q = ex.video || (ex.name + " exercise");
    $("videoBtn").href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
    $("videoBtn").setAttribute("aria-label", "Watch video demo of " + ex.name);
    $("googleBtn").href = "https://www.google.com/search?tbm=vid&q=" + encodeURIComponent(ex.name + " exercise technique");
  }
}

function afterNav(){
  persist();
  $("main").scrollTop = 0;
  if(window.showHeader) window.showHeader();
}
function render(){
  buildTabs(); buildJump(); renderCard(); renderChrome(); afterNav();
}
function go(delta){
  const n = session().items.length;
  const t = eIdx + delta;
  if(t < 0 || t >= n) return;
  eIdx = t;
  buildJump(); renderCard(); renderChrome(); afterNav();
}

/* =========================================================
   EVENTS
   ========================================================= */

$("prevBtn").addEventListener("click", ()=>go(-1));
$("nextBtn").addEventListener("click", ()=>go(1));
$("jump").addEventListener("change", e=>{
  eIdx = parseInt(e.target.value,10) || 0;
  renderCard(); renderChrome(); afterNav();
});

document.addEventListener("keydown", e=>{
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "select" || tag === "input" || tag === "textarea") return;
  if(e.key === "ArrowRight"){ e.preventDefault(); go(1); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  else if(e.code === "Space"){
    if(tag === "button" || tag === "a") return;          // let Space activate the focused control
    if(!timerEl.isConnected) return;
    e.preventDefault(); T.running ? pauseTimer() : startTimer();
  }
  else if((e.key === "r" || e.key === "R") && timerEl.isConnected){ resetTimer(); }
});

/* horizontal swipe between cards (ignores vertical scroll) */
(function(){
  const el = $("main");
  let x0=null, y0=null, lock=null;
  el.addEventListener("touchstart", e=>{
    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; lock=null;
  }, {passive:true});
  el.addEventListener("touchmove", e=>{
    if(x0===null) return;
    const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if(lock===null && (Math.abs(dx)>10 || Math.abs(dy)>10)) lock = Math.abs(dx)>Math.abs(dy)?"x":"y";
  }, {passive:true});
  el.addEventListener("touchend", e=>{
    if(x0===null || lock!=="x"){ x0=null; return; }
    if(e.target.closest && e.target.closest(".tbl-wrap")){ x0=null; return; }
    const dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>65) go(dx<0?1:-1);
    x0=null; lock=null;
  }, {passive:true});
})();

/* =========================================================
   DYNAMIC HEADER: hides as you scroll into the card,
   returns 1:1 as you scroll back up
   ========================================================= */
(function(){
  const head = document.querySelector("header.top");
  const main = $("main");
  const app  = document.querySelector(".app");
  let headH = 0, offset = 0, lastY = 0, ticking = false, settleTimer = 0, settleClass = 0;

  function measure(){
    const h = head.offsetHeight;
    if(h === headH) return;
    headH = h;
    app.style.setProperty("--head-h", headH + "px");
    if(offset > headH) offset = headH;
    apply();
  }
  function apply(animate){
    if(animate){
      head.classList.add("settling");
      clearTimeout(settleClass);
      settleClass = setTimeout(()=>head.classList.remove("settling"), 260);
    }
    head.style.transform = "translate3d(0,-" + offset + "px,0)";
    head.classList.toggle("raised", main.scrollTop > 4 && offset < headH - 1);
  }
  function settle(){
    if(offset <= 0 || offset >= headH) return;
    offset = offset > headH * 0.45 ? headH : 0;
    apply(true);
  }
  function onScroll(){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(()=>{
      ticking = false;
      const y  = main.scrollTop;
      const dy = y - lastY;
      lastY = y;
      const atEnd = (main.scrollHeight - y - main.clientHeight) < 2;
      if(y <= 0)              offset = 0;
      else if(atEnd && dy>0)  { /* iOS rubber-band at the end: ignore */ }
      else                    offset = Math.min(headH, Math.max(0, offset + dy));
      apply(false);
      clearTimeout(settleTimer);
      settleTimer = setTimeout(settle, 160);
    });
  }
  window.showHeader = function(){ offset = 0; lastY = main.scrollTop; apply(true); };

  main.addEventListener("scroll", onScroll, {passive:true});
  window.addEventListener("resize", measure);
  window.addEventListener("orientationchange", ()=>setTimeout(measure, 260));
  if(window.ResizeObserver) new ResizeObserver(measure).observe(head);
  if(window.visualViewport) visualViewport.addEventListener("resize", measure);
  measure();
})();

render();
</script>
</body>
