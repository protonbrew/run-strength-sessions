<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Strength exercise guide for Half Marathon Plan v02">
<title>Strength Sessions — Half Marathon Plan v02</title>
<style>
:root{
  color-scheme: dark light;
  --bg:#0f1216;
  --bg2:#141a21;
  --card:#171d25;
  --card2:#1d242e;
  --fg:#e9eef4;
  --muted:#98a6b5;
  --line:#28313d;
  --accent:#4cc2ff;
  --accent-ink:#04202e;
  --good:#7bd88f;
  --warn:#ffb15c;
  --bad:#ff7a7a;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --radius:16px;
  --maxw:820px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f6f9; --bg2:#ffffff; --card:#ffffff; --card2:#f1f4f8;
    --fg:#16202b; --muted:#5d6c7c; --line:#dde4ec;
    --accent:#0a6fb0; --accent-ink:#ffffff;
    --good:#1f7a45; --warn:#a8600d; --bad:#b4352f;
    --shadow:0 8px 24px rgba(20,40,60,.10);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,select,a{font-family:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.app{
  display:flex; flex-direction:column;
  height:100vh; height:100dvh;
  position:relative;
}

/* ---------- HEADER ---------- */
header.top{
  position:fixed; top:0; left:0; right:0; z-index:30;
  transform:translate3d(0,0,0);
  will-change:transform;
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));
}
header.top.settling{transition:transform .2s cubic-bezier(.2,.7,.3,1)}
header.top.raised{box-shadow:0 8px 20px rgba(0,0,0,.30)}
@media (prefers-color-scheme: light){
  header.top.raised{box-shadow:0 8px 18px rgba(20,40,60,.13)}
}
.top-inner{max-width:var(--maxw);margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.brand h1{font-size:1.02rem;margin:0;letter-spacing:.2px}
.brand .sub{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}

.tabs{
  display:flex;gap:6px;background:var(--card2);border:1px solid var(--line);
  padding:4px;border-radius:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 1 auto;white-space:nowrap;padding:9px 12px;border-radius:11px;
  font-size:.86rem;font-weight:600;color:var(--muted);text-align:center;
  transition:background .16s,color .16s;
}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.tab .tab-sub{display:block;font-size:.68rem;font-weight:500;opacity:.8}

.jump-row{display:flex;gap:8px;align-items:center;margin-top:10px}
.jump-row label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;flex:0 0 auto}
select#jump{
  flex:1 1 auto;min-width:0;appearance:none;-webkit-appearance:none;
  background:var(--card2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2398a6b5' stroke-width='3'><path d='M5 9l7 7 7-7'/></svg>") no-repeat right 12px center;
  border:1px solid var(--line);color:var(--fg);border-radius:11px;
  padding:10px 34px 10px 12px;font-size:.9rem;font-weight:500;
}
.session-note{
  margin:10px 0 0;padding:9px 12px;border-radius:11px;font-size:.82rem;
  background:color-mix(in srgb,var(--warn) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);
  color:var(--fg);
}
.session-note.hide{display:none}

/* ---------- MAIN ---------- */
main{
  flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  padding:calc(var(--head-h,168px) + 12px) calc(14px + env(safe-area-inset-right)) 26px calc(14px + env(safe-area-inset-left));
  scroll-padding-top:calc(var(--head-h,168px) + 12px);
}
.card{
  max-width:var(--maxw);margin:0 auto;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.card-head{padding:16px 16px 14px;border-bottom:1px solid var(--line);background:var(--card2)}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.11em;color:var(--accent);font-weight:700}
.card-head h2{margin:6px 0 12px;font-size:clamp(1.25rem,4.6vw,1.6rem);line-height:1.2;letter-spacing:-.2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:6px 10px;min-width:64px;
}
.chip .k{display:block;font-size:.63rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.chip .v{display:block;font-size:.95rem;font-weight:700}
.chip.hero{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

.card-body{padding:4px 16px 18px}
section.blk{padding:14px 0;border-bottom:1px solid var(--line)}
section.blk:last-child{border-bottom:0;padding-bottom:4px}
h3.blk-t{
  margin:0 0 8px;font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);font-weight:700;display:flex;align-items:center;gap:7px;
}
h3.blk-t::before{content:"";width:3px;height:13px;background:var(--accent);border-radius:2px}
h3.blk-t.warn::before{background:var(--bad)}
h3.blk-t.good::before{background:var(--good)}
.blk p{margin:0 0 8px}
.blk p:last-child{margin-bottom:0}

ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{
  counter-increment:s;position:relative;padding:0 0 12px 38px;
}
ol.steps li:last-child{padding-bottom:0}
ol.steps li::before{
  content:counter(s);position:absolute;left:0;top:1px;
  width:26px;height:26px;border-radius:50%;
  background:color-mix(in srgb,var(--accent) 16%,transparent);
  color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  display:flex;align-items:center;justify-content:center;
  font-size:.78rem;font-weight:800;
}
.sub-t{margin:14px 0 8px;font-size:.9rem;font-weight:700}
.sub-t:first-child{margin-top:0}

ul.dots{margin:0;padding-left:20px}
ul.dots li{margin-bottom:7px}
ul.dots li:last-child{margin-bottom:0}
ul.dots.bad li::marker{color:var(--bad)}
ul.dots.good li::marker{color:var(--good)}

.callout{
  background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:0 11px 11px 0;padding:11px 13px;margin:0 0 10px;
}
.callout:last-child{margin-bottom:0}
.callout.rule{border-left-color:var(--warn)}
.callout.feel{border-left-color:var(--good)}
.callout h4{margin:0 0 4px;font-size:.85rem;font-weight:800}
.callout p{margin:0;font-size:.94rem}
strong{font-weight:700}

/* ---------- TIMER ---------- */
.timer{
  margin:14px 0 0;border:1px solid var(--line);border-radius:14px;
  background:var(--card2);overflow:hidden;
}
.timer.timed{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.t-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 13px;width:100%;
}
.t-head .lbl{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em}
.badge{
  font-size:.62rem;letter-spacing:.06em;padding:3px 7px;border-radius:999px;
  background:color-mix(in srgb,var(--accent) 18%,transparent);
  color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);
}
.t-head .caret{color:var(--muted);font-size:.78rem;font-weight:700}
.t-body{padding:0 13px 14px;display:block}
.timer.collapsed .t-body{display:none}
.t-phase{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:700;min-height:1.2em}
.t-display{
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
  font-size:clamp(2.6rem,13vw,3.6rem);font-weight:800;line-height:1.05;letter-spacing:-1.5px;margin:2px 0 2px;
}
.t-display.rest{color:var(--warn)}
.t-display.done{color:var(--good)}
.t-round{font-size:.8rem;color:var(--muted);min-height:1.2em}
.t-bar{height:6px;background:var(--card);border-radius:99px;overflow:hidden;margin:9px 0 12px;border:1px solid var(--line)}
.t-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .18s linear}
.t-bar i.rest{background:var(--warn)}
.t-presets{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.preset{
  font-size:.78rem;font-weight:600;padding:7px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);color:var(--muted);
}
.preset[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.t-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.t-controls button{
  padding:12px 8px;border-radius:11px;font-weight:800;font-size:.9rem;
  border:1px solid var(--line);background:var(--card);min-height:46px;
}
.t-controls button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.t-controls button:disabled{opacity:.42;cursor:default}

/* ---------- FOOTER ---------- */
footer.bottom{
  flex:0 0 auto;
  background:color-mix(in srgb,var(--bg2) 92%,transparent);
  backdrop-filter:saturate(160%) blur(12px);
  -webkit-backdrop-filter:saturate(160%) blur(12px);
  border-top:1px solid var(--line);
  padding:9px calc(12px + env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
}
.bottom-inner{max-width:var(--maxw);margin:0 auto;display:flex;flex-direction:column;gap:8px}
.video-row{display:flex;gap:8px}
.btn-video{
  flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:8px;
  text-decoration:none;color:var(--fg);
  background:var(--card2);border:1px solid var(--line);
  border-radius:12px;padding:11px;font-size:.88rem;font-weight:700;min-height:46px;
}
.btn-video:active{background:var(--card)}
.btn-video .play{color:var(--bad);font-size:1.05rem;line-height:1}
.btn-alt{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  text-decoration:none;color:var(--muted);background:var(--card2);
  border:1px solid var(--line);border-radius:12px;padding:11px 13px;
  font-size:.78rem;font-weight:700;min-height:46px;
}
.nav-row{display:flex;align-items:center;gap:8px}
.nav-btn{
  flex:1 1 0;min-height:52px;border-radius:13px;font-size:.95rem;font-weight:800;
  background:var(--card2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.nav-btn.next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nav-btn:disabled{opacity:.35;cursor:default}
.counter{flex:0 0 auto;text-align:center;min-width:96px}
.counter .n{font-size:.86rem;font-weight:800;font-variant-numeric:tabular-nums}
.counter .pbar{height:4px;border-radius:99px;background:var(--card2);border:1px solid var(--line);overflow:hidden;margin-top:5px}
.counter .pbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s ease}

@media (min-width:700px){
  .bottom-inner{flex-direction:row-reverse;align-items:center;gap:12px}
  .video-row{flex:0 0 auto;max-width:320px}
  .nav-row{flex:1 1 auto}
}
@media (max-height:760px){
  .bottom-inner{gap:6px}
  .btn-video,.btn-alt{min-height:42px;padding:9px 11px;font-size:.84rem}
  .nav-btn{min-height:46px}
  header.top{padding-bottom:8px}
  .brand{margin-bottom:8px}
  .jump-row{margin-top:8px}
}
.kbd-hint{display:none;font-size:.68rem;color:var(--muted);text-align:center;margin-top:2px}
@media (hover:hover) and (pointer:fine){.kbd-hint{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1>Strength Sessions</h1>
        <span class="sub">Half Marathon Plan v02</span>
      </div>
      <div class="tabs" id="tabs" role="tablist" aria-label="Training session"></div>
      <div class="jump-row">
        <label for="jump">Jump to</label>
        <select id="jump" aria-label="Jump to exercise"></select>
      </div>
      <p class="session-note hide" id="sessionNote"></p>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <article class="card" id="card" aria-live="polite"></article>
  </main>

  <footer class="bottom">
    <div class="bottom-inner">
      <div class="video-row">
        <a class="btn-video" id="videoBtn" href="#" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">
          <span class="play">&#9654;</span><span>Watch Video Demo</span>
        </a>
        <a class="btn-alt" id="googleBtn" href="#" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" title="Search Google instead">Google</a>
      </div>
      <div class="nav-row">
        <button class="nav-btn" id="prevBtn" type="button">&#8249;&nbsp; Prev</button>
        <div class="counter">
          <div class="n" id="counter">1 of 5</div>
          <div class="pbar"><i id="pfill"></i></div>
        </div>
        <button class="nav-btn next" id="nextBtn" type="button">Next &nbsp;&#8250;</button>
      </div>
      <div class="kbd-hint">&#8592; / &#8594; to move &middot; Space to start or pause the timer</div>
    </div>
  </footer>
</div>

<script>
"use strict";

/* =========================================================
   DATA — exercises stored once, sessions reference them by id
   ========================================================= */

const EX = {

/* ------------------------ MONDAY, SESSION A ------------------------ */

"standing-calf": {
  name: "Standing Calf Raise, Straight Knee",
  video: "standing calf raise straight knee eccentric form",
  chips: [ {k:"Sets",v:"4",hero:true}, {k:"Reps",v:"8–10",hero:true}, {k:"Tempo",v:"3 s lower"} ],
  setup: "Stand on the edge of a step or stair with the balls of your feet on the edge and your heels hanging off. Hold a wall or railing for balance. If you have a dumbbell, hold it in one hand. Start with bodyweight until the movement feels natural.",
  stepGroups: [{ title:"The movement", steps:[
    "Start with your heels dropped below the step. You should feel a gentle stretch in your calves.",
    "Push up onto your toes as high as you can. Pause for one second at the top.",
    "Lower slowly, counting \"one-thousand, two-thousand, three-thousand\" on the way down. This slow lowering is the whole point of the exercise. Don't rush it.",
    "Let your heels drop just below the step. That's one rep."
  ]}],
  feel: "The big calf muscle (gastrocnemius) doing the work. Both calves should be burning evenly by rep 7 or 8. You should feel the stretch at the bottom and a hard squeeze at the top.",
  cues: [ {t:"Keep your knees straight", b:"Throughout. Not locked rigid, but straight. If your knees bend, you shift the load off the gastrocnemius and onto the soleus (that's the next exercise)."} ],
  mistakes: [{ items:[
    "Bouncing at the bottom instead of pausing. This uses elastic recoil and bypasses the muscle.",
    "Rushing the lowering phase. If you aren't counting three seconds, you're going too fast.",
    "Leaning forward. Stay upright with your weight directly over the balls of your feet.",
    "Going too heavy too soon. You want to complete 8 reps with good form and a 3-second lower. If you can't, drop the weight."
  ]}],
  timer: null
},

"seated-calf": {
  name: "Seated Calf Raise, Bent Knee",
  video: "seated calf raise bent knee soleus home form",
  chips: [ {k:"Sets",v:"3",hero:true}, {k:"Reps",v:"12–15",hero:true}, {k:"Tempo",v:"2 s lower"} ],
  setup: "Sit on a chair or bench with your feet flat on the floor, knees bent at about 90 degrees. Place a weight across your knees (a dumbbell resting on a folded towel works). Put the balls of your feet on a thick book or low platform so your heels can drop below the surface.",
  stepGroups: [{ title:"The movement", steps:[
    "Press through the balls of your feet and lift your heels as high as you can.",
    "Pause briefly at the top.",
    "Lower slowly (2 seconds) back to the start."
  ]}],
  feel: "A burn deeper and lower in the calf than the standing version. This is the soleus, the muscle underneath the gastrocnemius. It sits closer to the Achilles tendon. You won't feel it as dramatically as the standing raise but it should be fatiguing by rep 12.",
  cues: [ {t:"Why it matters", b:"The soleus is the single hardest-working muscle during running. It produces more force than any other muscle at every stride. Training it bent-knee isolates it specifically because bending the knee slackens the gastrocnemius and forces the soleus to do the work alone."} ],
  mistakes: [{ items:[
    "Skipping this because the standing version \"already did calves.\" They target different muscles.",
    "No platform under the feet, so the heel never drops below the toes. You lose the bottom-range loading.",
    "Rocking the torso to generate momentum."
  ]}],
  timer: null
},

"split-squat": {
  name: "Rear-Foot Elevated Split Squat",
  alias: "Bulgarian Split Squat",
  video: "bulgarian split squat proper form tutorial",
  chips: [ {k:"Sets",v:"3",hero:true}, {k:"Reps",v:"8 / leg",hero:true} ],
  setup: "Stand about 60 to 70 cm in front of a couch, chair, or bench. Reach one foot back and rest the top of that foot on the surface behind you. Your front foot is flat on the ground, pointing straight ahead. Most of your weight should be on the front leg.",
  stepGroups: [{ title:"The movement", steps:[
    "Bend your front knee and lower your body straight down. Think of dropping your back knee toward the floor, not pushing your front knee forward.",
    "Go down until your front thigh is roughly parallel to the ground, or as deep as you can with good balance.",
    "Push back up through your front heel."
  ]}],
  feel: "Your front-leg quad (front of thigh) and glute (backside) doing most of the work. Some stretch in the hip flexor of the back leg. This is a single-leg strength exercise, so expect one side to feel harder than the other.",
  cues: [ {t:"Keep your torso upright", b:"A slight forward lean is fine, but don't fold at the waist."} ],
  mistakes: [{ items:[
    "Standing too close to the bench. Your front knee ends up way past your toes and the knee joint takes excessive load. Step further forward.",
    "Standing too far from the bench. You end up in an awkward lunge and can't get depth. Adjust until the bottom position feels stable.",
    "Letting the front knee collapse inward. Consciously push it outward so it tracks over your second or third toe.",
    "Gripping the back foot. The back leg is just a kickstand for balance. If you're pushing off the back foot, you're cheating the front leg.",
    "Adding weight before the balance is sorted. Get 3 x 8 confidently with bodyweight first."
  ]}],
  timer: null
},

"sl-rdl": {
  name: "Single-Leg Romanian Deadlift",
  video: "single leg romanian deadlift form tutorial",
  chips: [ {k:"Sets",v:"3",hero:true}, {k:"Reps",v:"8 / leg",hero:true} ],
  setup: "Stand on one leg with a slight bend in that knee. Hold a dumbbell or kettlebell in the opposite hand (left leg standing, right hand holds the weight). If you have nothing, do it with bodyweight. Stand next to a wall if balance is a problem at first.",
  stepGroups: [{ title:"The movement", steps:[
    "Hinge forward at the hip, letting your free leg drift straight back behind you as a counterbalance. Imagine your body is a seesaw pivoting at the hip.",
    "Keep lowering the weight toward the ground until you feel a strong stretch in the hamstring of the standing leg. For most people this is when the torso is roughly parallel to the floor.",
    "Squeeze your glute and hamstring to stand back up."
  ]}],
  feel: "A deep stretch and then a contraction in the back of your standing-leg thigh (hamstring) and your glute. Your lower back should feel like it's working to stay flat, but it should not hurt.",
  cues: [ {t:"The standing knee stays slightly bent", b:"The entire time. Do not lock it out, and do not let it bend further as you hinge."} ],
  mistakes: [{ items:[
    "Rounding the lower back. This is the most important one. Your back should stay flat from your head to your tailbone throughout the entire movement. If your back rounds, you've gone too deep. Come back up 5 cm.",
    "Rotating the hips. Your hips should stay square to the ground, like you have headlights on the front of both hip bones and they're both pointing at the floor. The free leg going out to the side is a sign of hip rotation.",
    "Bending the standing knee more as you hinge. The knee angle stays fixed.",
    "Looking up. Keep your neck neutral, eyes on a spot about 2 metres ahead of you on the floor.",
    "Wobbling excessively and treating it as a balance exercise. If you can't do it without grabbing something, stand next to a wall and lightly touch it. The goal is hamstring and glute loading, not balance practice."
  ]}],
  timer: null
},

"copenhagen": {
  name: "Copenhagen Plank",
  video: "copenhagen plank adductor exercise form",
  chips: [ {k:"Sets",v:"3",hero:true}, {k:"Hold",v:"20–30 s",hero:true}, {k:"Per",v:"Side"} ],
  setup: "Lie on your side next to a bench, couch, or sturdy chair. Place the inside of your top leg's knee or lower shin on the surface. Your bottom leg hangs free underneath. Prop yourself up on your bottom elbow, directly under your shoulder.",
  stepGroups: [{ title:"The movement", steps:[
    "Lift your hips off the ground by squeezing the inner thigh of your top leg into the bench.",
    "Your body should form a straight line from your top-leg knee to your shoulder.",
    "Hold this position. Breathe normally. Don't hold your breath.",
    "Lower down. Switch sides."
  ]}],
  feel: "Your inner thigh (adductor) of the top leg working hard. This is the muscle group that refers pain to the groin and is a common running injury site.",

function buildIntervals(rounds, work, rest, wLabel, rLabel){
  const out = [];
  for (let i=1;i<=rounds;i++){

    if (i<rounds) out.push({label:`${rLabel} ${i} of ${rounds}`, s:rest, rest:true, round:i, rounds:rounds});
  }
  return out;
}

const DEFAULT_PRESETS = [

/* --- audio cues, generated in-browser --- */
let AC = null;
function beep(times, freq, dur){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    for(let i=0;i<times;i++){
      const t0 = AC.currentTime + i*(dur+0.09);
      const o = AC.createOscillator(), g = AC.createGain();
      o.type="sine"; o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.35,t0+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+0.02);
    }
  }catch(e){}
}
async function lockScreen(on){
  try{
    if(on && "wakeLock" in navigator && !T.wakeLock){
      T.wakeLock = await navigator.wakeLock.request("screen");
      T.wakeLock.addEventListener("release", ()=>{ T.wakeLock = null; });
    } else if(!on && T.wakeLock){ await T.wakeLock.release(); T.wakeLock = null; }
  }catch(e){}
}

function fmt(ms){
  const total = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(total/60), s = total%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function loadPreset(i, keepCollapsed){
  stopLoop();
  T.presetIdx = i;
  const p = activePresets[i];
  T.running = false;
  T.stopwatch = !!p.stopwatch;
  T.phases = p.stopwatch ? [] : p.phases.map(x=>Object.assign({},x));
  T.idx = 0;
  T.elapsed = 0; T.base = 0;
  T.remaining = T.stopwatch ? 0 : T.phases[0].s*1000;
  [...tPresets.children].forEach((b,bi)=>b.setAttribute("aria-pressed", bi===i ? "true":"false"));
  tStart.textContent = "Start"; tStart.disabled = false; tPause.disabled = true;
  paint(true);
  if(!keepCollapsed){ /* no-op */ }
}

function paint(reset){
  const phase = T.stopwatch ? null : T.phases[T.idx];
  const isRest = !!(phase && phase.rest);
  tDisplay.classList.toggle("rest", isRest && !T.done);
  tDisplay.classList.toggle("done", !!T.done);

  if(T.stopwatch){
    tPhase.textContent = "Stopwatch";
    tDisplay.textContent = fmt(T.elapsed);
    tRound.textContent = T.running ? "Counting up" : "";
    tFill.style.width = "0%";
    tFill.classList.remove("rest");
    return;
  }
  tPhase.textContent = T.done ? "Complete" : phase.label;
  tDisplay.textContent = T.done ? "00:00" : fmt(T.remaining);
  const total = T.phases.length;
  tRound.textContent = total > 1 ? `Segment ${Math.min(T.idx+1,total)} of ${total}` : "";
  const pct = T.done ? 100 : (1 - (T.remaining/(phase.s*1000))) * 100;
  tFill.style.width = Math.max(0,Math.min(100,pct)) + "%";
  tFill.classList.toggle("rest", isRest);
  if(reset){ T.done = false; tDisplay.classList.remove("done"); tFill.style.width = "0%"; }
}

function loop(){
  if(!T.running) return;
  const now = performance.now();
  if(T.stopwatch){
    T.elapsed = T.base + (now - T.startedAt);
    paint();
  } else {
    T.remaining = T.endAt - now;
    if(T.remaining <= 0){
      const last = T.idx >= T.phases.length - 1;
      if(last){
        T.remaining = 0; T.running = false; T.done = true;
        beep(3, 880, 0.16);
        tStart.textContent = "Start"; tStart.disabled = false; tPause.disabled = true;
        lockScreen(false);
        paint();
        return;
      }
      T.idx++;
      const nxt = T.phases[T.idx];
      beep(nxt.rest ? 1 : 2, nxt.rest ? 520 : 760, 0.14);
      T.endAt = now + nxt.s*1000;
      T.remaining = nxt.s*1000;
    }
    paint();
  }
  T.raf = requestAnimationFrame(loop);
}
function stopLoop(){ if(T.raf) cancelAnimationFrame(T.raf); T.raf = 0; }

function startTimer(){
  if(T.running) return;
  if(T.done) loadPreset(T.presetIdx);
  beep(1, 660, 0.1);
  T.running = true;
  const now = performance.now();
  if(T.stopwatch){ T.startedAt = now; }
  else { T.endAt = now + (T.remaining > 0 ? T.remaining : T.phases[T.idx].s*1000); }
  tStart.disabled = true; tPause.disabled = false; tStart.textContent = "Running";
  lockScreen(true);
  stopLoop(); T.raf = requestAnimationFrame(loop);
}
function pauseTimer(){
  if(!T.running) return;
  T.running = false; stopLoop();
  if(T.stopwatch) T.base = T.elapsed; else T.remaining = Math.max(0, T.endAt - performance.now());
  tStart.disabled = false; tPause.disabled = true; tStart.textContent = "Resume";
  lockScreen(false);
  paint();
}
function resetTimer(){ lockScreen(false); loadPreset(T.presetIdx); }

tStart.addEventListener("click", startTimer);
tPause.addEventListener("click", pauseTimer);
tReset.addEventListener("click", resetTimer);

function configureTimer(ex){
  pauseTimer();

    b.setAttribute("aria-pressed","false");
    b.addEventListener("click", ()=>loadPreset(i));
    tPresets.appendChild(b);
  });
  const def = Math.max(0, activePresets.findIndex(p=>p.default));
  loadPreset(def);
}

        <div class="callout feel"><p>${esc(ex.feel)}</p></div>
      </section>
      ${cues ? `<section class="blk"><h3 class="blk-t">Key cues</h3>${cues}</section>` : ""}
      ${ex.altSteps ? `<section class="blk">
          <h3 class="blk-t">Alternative</h3>
          <div class="sub-t">${esc(ex.altTitle)}</div>
          <ol class="steps">${ex.altSteps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
        </section>` : ""}
      <section class="blk">
        <h3 class="blk-t warn">Common mistakes</h3>
        ${mistakes}
      </section>
      <div id="timerSlot"></div>
    </div>`;

  $("timerSlot").appendChild(timerEl);
  configureTimer(ex);
}

function renderChrome(){
  const s = session();
  [...$("tabs").children].forEach((b,i)=>b.setAttribute("aria-selected", String(i===sIdx)));
  const note = $("sessionNote");
  if(s.note){ note.textContent = s.note; note.classList.remove("hide"); }
  else { note.classList.add("hide"); }

  const n = s.items.length;
  $("counter").textContent = `${eIdx+1} of ${n}`;
  $("pfill").style.width = ((eIdx+1)/n*100) + "%";
  $("prevBtn").disabled = eIdx === 0;
  $("nextBtn").disabled = eIdx === n-1;

  const ex = current();
  const q = ex.video || (ex.name + " exercise");
  $("videoBtn").href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(q + " tutorial");
  $("videoBtn").setAttribute("aria-label", "Watch video demo of " + ex.name);
  $("googleBtn").href = "https://www.google.com/search?q=" + encodeURIComponent(ex.name + " exercise video tutorial") + "&tbm=vid";
}

function render(){
  buildTabs();
  buildJump();
  renderCard();
  renderChrome();
  persist();
  $("main").scrollTop = 0;
  if(window.showHeader) window.showHeader();
}

function go(delta){
  const n = session().items.length;
  const t = eIdx + delta;
  if(t < 0 || t >= n) return;
  eIdx = t;
  buildJump(); renderCard(); renderChrome(); persist();
  $("main").scrollTop = 0;
  if(window.showHeader) window.showHeader();
}

/* =========================================================
   EVENTS
   ========================================================= */

$("prevBtn").addEventListener("click", ()=>go(-1));
$("nextBtn").addEventListener("click", ()=>go(1));
$("jump").addEventListener("change", e=>{
  eIdx = parseInt(e.target.value,10) || 0;
  renderCard(); renderChrome(); persist();
  $("main").scrollTop = 0;
  if(window.showHeader) window.showHeader();
});

document.addEventListener("keydown", e=>{
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "select" || tag === "input" || tag === "textarea") return;
  if(e.key === "ArrowRight"){ e.preventDefault(); go(1); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  else if(e.code === "Space"){ e.preventDefault(); T.running ? pauseTimer() : startTimer(); }
  else if(e.key === "r" || e.key === "R"){ resetTimer(); }
});

/* horizontal swipe between exercises (ignores vertical scroll) */
(function(){
  const el = $("main");
  let x0=null, y0=null, lock=null;
  el.addEventListener("touchstart", e=>{
    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; lock=null;
  }, {passive:true});
  el.addEventListener("touchmove", e=>{
    if(x0===null) return;
    const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if(lock===null && (Math.abs(dx)>10 || Math.abs(dy)>10)) lock = Math.abs(dx)>Math.abs(dy)?"x":"y";
  }, {passive:true});
  el.addEventListener("touchend", e=>{
    if(x0===null || lock!=="x"){ x0=null; return; }
    const dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>65) go(dx<0?1:-1);
    x0=null; lock=null;
  }, {passive:true});
})();

/* =========================================================
   DYNAMIC HEADER — hides as you scroll into the card,
   returns 1:1 as you scroll back up
   ========================================================= */
(function(){
  const head = document.querySelector("header.top");
  const main = $("main");
  const app  = document.querySelector(".app");
  let headH = 0, offset = 0, lastY = 0, ticking = false, settleTimer = 0, settleClass = 0;

  function measure(){
    const h = head.offsetHeight;
    if(h === headH) return;
    headH = h;
    app.style.setProperty("--head-h", headH + "px");
    if(offset > headH) offset = headH;
    apply();
  }

  function apply(animate){
    if(animate){
      head.classList.add("settling");
      clearTimeout(settleClass);
      settleClass = setTimeout(()=>head.classList.remove("settling"), 260);
    }
    head.style.transform = "translate3d(0,-" + offset + "px,0)";
    head.classList.toggle("raised", main.scrollTop > 4 && offset < headH - 1);
  }

  function settle(){
    if(offset <= 0 || offset >= headH) return;
    offset = offset > headH * 0.45 ? headH : 0;
    apply(true);
  }

  function onScroll(){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(()=>{
      ticking = false;
      const y  = main.scrollTop;
      const dy = y - lastY;
      lastY = y;
      const atEnd = (main.scrollHeight - y - main.clientHeight) < 2;
      if(y <= 0)              offset = 0;                                   // top: always show
      else if(atEnd && dy>0)  { /* iOS rubber-band at the end: ignore */ }
      else                    offset = Math.min(headH, Math.max(0, offset + dy));
      apply(false);
      clearTimeout(settleTimer);
      settleTimer = setTimeout(settle, 160);
    });
  }

  window.showHeader = function(){
    offset = 0; lastY = main.scrollTop;
    apply(true);
  };

  main.addEventListener("scroll", onScroll, {passive:true});
  window.addEventListener("resize", measure);
  window.addEventListener("orientationchange", ()=>setTimeout(measure, 260));
  if(window.ResizeObserver) new ResizeObserver(measure).observe(head);
  if(window.visualViewport) visualViewport.addEventListener("resize", measure);
  measure();
})();

render();
</script>
